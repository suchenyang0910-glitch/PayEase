name: S0.3 - Local Security Gates (Semgrep / Money guard / License allowlist)

on:
  push:
    branches: [main]
    paths:
      - ".semgrep/**"
      - "scripts/**"
      - "packages/**"
      - "broker-api/**"
      - "broker-platform/**"
      - "lender-core/**"
      - "employer-portal/**"
      - "hr-verify-portal/**"
      - "finance-verify-portal/**"
      - "partner-contracts/**"
      - "docs/**"
      - "fixtures/**"
      - "prototype/**"
      - "infra/local/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
      - "SECURITY_EXCEPTIONS.yml"
  pull_request:
    branches: [main]
    paths:
      - ".semgrep/**"
      - "scripts/**"
      - "packages/**"
      - "broker-api/**"
      - "broker-platform/**"
      - "lender-core/**"
      - "employer-portal/**"
      - "hr-verify-portal/**"
      - "finance-verify-portal/**"
      - "partner-contracts/**"
      - "docs/**"
      - "fixtures/**"
      - "prototype/**"
      - "infra/local/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
      - "SECURITY_EXCEPTIONS.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22.13.1"
  PNPM_VERSION: "9.12.0"

jobs:
  gate-local-security:
    name: Gate Local - Semgrep + Money guard + License allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEMGREP_RULES_DIR: .semgrep/rules
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies frozen
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Semgrep
        run: |
          # Semgrep 1.96 imports pkg_resources, which newer setuptools no longer ships.
          # Keep the scanner version deterministic and restore the compatible provider.
          pipx install semgrep==1.96.0
          pipx runpip semgrep install --force-reinstall "setuptools==80.9.0"
          pipx runpip semgrep show setuptools
          "${PIPX_HOME}/venvs/semgrep/bin/python" -c "import pkg_resources"
          semgrep --version

      - name: CI-04 Sast Semgrep PayEase 4 custom rules
        run: |
          set -e
          echo "=== Custom rules (PayEase 4 P0) ==="
          semgrep scan \
            --config="${SEMGREP_RULES_DIR}" \
            --severity ERROR \
            --timeout 30 \
            --max-memory 4096 \
            --no-rewrite-rule-ids \
            --strict

      - name: CI-04 Sast Semgrep upstream owasp-top-ten + typescript ERROR strict
        run: |
          set -e
          echo "=== Upstream OWASP top-10 / typescript (S0.4 ERROR strict, not warn) ==="
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --severity ERROR \
            --timeout 30 \
            --max-memory 4096 \
            --strict \
            --metrics=off \
            broker-api broker-platform lender-core employer-portal partner-contracts packages

      - name: CI-10 Money type guard bash
        run: |
          set -e
          chmod +x ./scripts/check-money-type.sh
          ./scripts/check-money-type.sh

      - name: CI-05 License allowlist scan bash
        run: |
          set -e
          chmod +x ./scripts/check-licenses.sh
          ./scripts/check-licenses.sh

      - name: S1-8.08 Schemathesis API fuzz placeholder non-exec real run in S1.0 and S0.2
        run: |
          echo "[S0.4 placeholder] Schemathesis real run requires:"
          echo "  1) partner-contracts openapi schema upgraded from stub (S1.0 MVP)"
          echo "  2) S0.2 ECS/ALB or local docker-compose SUT (S1.0)"
          echo "  3) Real cmd: schemathesis run docs/openapi-v1.yaml --base-url=http://localhost:3000 --checks all --hypothesis-max-examples=200"

      - name: S1 Nightly ZAP baseline placeholder non-exec real run after S0.2 Staging ALB WAF
        run: |
          echo "[S0.4 placeholder] OWASP ZAP Baseline real run requires:"
          echo "  1) S0.2 Staging ALB + WAFv2 reachable over HTTPS"
          echo "  2) Real cmd: docker run -t owasp/zap2docker-stable zap-baseline.py -t https://staging.payease.example -r zap-report.html -J zap-report.json"
          echo "  3) Alarms flow to security events with 90-day remediation SLA"

      - name: Upload local-security-gate report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-security-gate-report
          path: |
            .semgrep/
            scripts/
          retention-days: 30

  secret-scan:
    name: Gate Secret Detection - Gitleaks (independent standard runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.24.3"
      NODE_VERSION: "22.13.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 (action runtime, avoid Node 24 deprecation warning)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install verified gitleaks CLI
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl --fail --show-error --silent --location -o "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --show-error --silent --location -o "/tmp/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (
            cd /tmp
            grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          )
          tar -xzf "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks
          gitleaks version

      - name: CI-07 Secret detection Gitleaks full history detect with .gitleaks.toml allowlist
        shell: bash
        run: |
          set -e
          gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code=1 \
            --report-format=sarif \
            --report-path=gitleaks-results.sarif \
            --log-level=debug

      - name: Upload gitleaks SARIF artifact if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks-results.sarif
          retention-days: 30
          if-no-files-found: ignore
