rules:
  - id: payease-hardcoded-secrets
    message: >-
      [CI-07] Hard-coded credential / key / token detected. Rotate immediately if committed,
      then move to AWS Secrets Manager / KMS / .env (never committed).
      See `docs/安全基线与上线验收清单.md §7 密钥与证书生命周期`.
    severity: ERROR
    languages:
      - generic
    metadata:
      category: security
      confidence: HIGH
      references:
        - docs/安全基线与上线验收清单.md#KEY-01
        - docs/安全基线与上线验收清单.md#CI-07
    patterns:
      - pattern-regex: (?i)(aws_access_key_id|aws_secret_access_key|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16})\s*[:=]\s*['"][A-Z0-9+/=]{10,}['"]
      - pattern-regex: (?i)(sk-[A-Za-z0-9-_]{20,}|pk-[A-Za-z0-9-_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})
      - pattern-regex: -----BEGIN ((RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY|PUBLIC KEY|CERTIFICATE)-----[\s\S]{0,10}?-----END
      - pattern-regex: (?i)(client_secret|api_secret|api_key|secret_key|private_key|signing_key|hmac_key|auth_token|bot_token|webhook_secret|jwt_secret|session_secret)\s*[:=]\s*['"][^'"\s]{8,}['"]
      - pattern-regex: (?i)(password|passwd|pwd)\s*[:=]\s*['"][^'"\s]{6,}['"]
