# VPS controlled-preview only. Keep the database on the internal Docker network;
# Caddy is the only public entry point and must enforce preview authentication.
# A release is unpacked into a commit-specific directory. Pinning the Compose
# project name prevents Docker from deriving a different name from that
# directory and accidentally creating an empty database volume during upgrade.
name: payease-preview

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payease_preview
      POSTGRES_USER: payease_preview
      POSTGRES_PASSWORD: ${PAYEASE_PREVIEW_POSTGRES_PASSWORD:?Set a VPS-local preview password}
    volumes:
      - payease-preview-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payease_preview -d payease_preview"]
      interval: 5s
      timeout: 3s
      retries: 20

  broker-api:
    build:
      context: ../..
      dockerfile: broker-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://payease_preview:${PAYEASE_PREVIEW_POSTGRES_PASSWORD:?Set a VPS-local preview password}@postgres:5432/payease_preview
      HOST: "0.0.0.0"
      PORT: "3100"
      # Optional after bootstrap: the API refuses bootstrap unless a deployment
      # operator explicitly supplies this value.
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # Production must set both values in the VPS-local environment file. The
      # JSON contains one or more enabled Bot ID/token pairs and is never
      # committed. A controlled preview still requires Telegram authentication
      # unless the additional opt-out below is set by its operator.
      PAYEASE_DEPLOYMENT_MODE: "controlled-preview"
      REQUIRE_TELEGRAM_AUTH: ${REQUIRE_TELEGRAM_AUTH:-false}
      # Required whenever Telegram authentication is enabled. This is the
      # exact Mini App HTTPS origin, not a Telegram URL or wildcard domain.
      PAYEASE_APPLICANT_ALLOWED_ORIGINS: ${PAYEASE_APPLICANT_ALLOWED_ORIGINS:-}
      PAYEASE_ALLOW_UNAUTHENTICATED_PREVIEW: ${PAYEASE_ALLOW_UNAUTHENTICATED_PREVIEW:-false}
      TELEGRAM_BOTS_JSON: ${TELEGRAM_BOTS_JSON:-}
      # A base64-encoded 32-byte AES key. It stays in the VPS-local env file;
      # applications with personal details fail closed when it is absent.
      PAYEASE_PII_ENCRYPTION_KEY: ${PAYEASE_PII_ENCRYPTION_KEY:-}
      # A later rotation uses a JSON object of { version: base64Key } and makes
      # PAYEASE_PII_ENCRYPTION_KEY_VERSION the active encryption key.
      PAYEASE_PII_ENCRYPTION_KEYS_JSON: ${PAYEASE_PII_ENCRYPTION_KEYS_JSON:-}
      PAYEASE_PII_ENCRYPTION_KEY_VERSION: ${PAYEASE_PII_ENCRYPTION_KEY_VERSION:-v1}
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  payease-preview-postgres:
