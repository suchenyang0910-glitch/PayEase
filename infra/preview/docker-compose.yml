# VPS controlled-preview only. Keep the database on the internal Docker network;
# Caddy is the only public entry point and must enforce preview authentication.
# A release is unpacked into a commit-specific directory. Pinning the Compose
# project name prevents Docker from deriving a different name from that
# directory and accidentally creating an empty database volume during upgrade.
name: payease-preview

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payease_preview
      POSTGRES_USER: payease_preview
      POSTGRES_PASSWORD: ${PAYEASE_PREVIEW_POSTGRES_PASSWORD:?Set a VPS-local preview password}
    volumes:
      # PostgreSQL 18 images manage the version-specific data directory below
      # /var/lib/postgresql. Mounting the legacy /data path makes the image
      # fail closed rather than initialize an upgrade-safe cluster. The new
      # volume is restored from a verified logical backup; the PostgreSQL 16
      # volume remains untouched for rollback during the acceptance window.
      - payease-preview-postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payease_preview -d payease_preview"]
      interval: 5s
      timeout: 3s
      retries: 20

  broker-api:
    build:
      context: ../..
      dockerfile: broker-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://payease_preview:${PAYEASE_PREVIEW_POSTGRES_PASSWORD:?Set a VPS-local preview password}@postgres:5432/payease_preview
      HOST: "0.0.0.0"
      PORT: "3100"
      # Optional after bootstrap: the API refuses bootstrap unless a deployment
      # operator explicitly supplies this value.
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # Production must set both values in the VPS-local environment file. The
      # JSON contains one or more enabled Bot ID/token pairs and is never
      # committed. A controlled preview still requires Telegram authentication
      # unless the additional opt-out below is set by its operator.
      PAYEASE_DEPLOYMENT_MODE: "controlled-preview"
      REQUIRE_TELEGRAM_AUTH: ${REQUIRE_TELEGRAM_AUTH:-false}
      # Required whenever Telegram authentication is enabled. This is the
      # exact Mini App HTTPS origin, not a Telegram URL or wildcard domain.
      PAYEASE_APPLICANT_ALLOWED_ORIGINS: ${PAYEASE_APPLICANT_ALLOWED_ORIGINS:-}
      PAYEASE_ALLOW_UNAUTHENTICATED_PREVIEW: ${PAYEASE_ALLOW_UNAUTHENTICATED_PREVIEW:-false}
      TELEGRAM_BOTS_JSON: ${TELEGRAM_BOTS_JSON:-}
      # A base64-encoded 32-byte AES key. It stays in the VPS-local env file;
      # applications with personal details fail closed when it is absent.
      PAYEASE_PII_ENCRYPTION_KEY: ${PAYEASE_PII_ENCRYPTION_KEY:-}
      # A later rotation uses a JSON object of { version: base64Key } and makes
      # PAYEASE_PII_ENCRYPTION_KEY_VERSION the active encryption key.
      PAYEASE_PII_ENCRYPTION_KEYS_JSON: ${PAYEASE_PII_ENCRYPTION_KEYS_JSON:-}
      PAYEASE_PII_ENCRYPTION_KEY_VERSION: ${PAYEASE_PII_ENCRYPTION_KEY_VERSION:-v1}
      # A distinct base64-encoded 32-byte HMAC key for normalized
      # ID/passport matching. Never reuse the PII encryption key.
      PAYEASE_IDENTITY_LOOKUP_KEY: ${PAYEASE_IDENTITY_LOOKUP_KEY:-}
      # Internal lender-to-broker transport is mTLS-only.  The host paths below
      # are VPS-local secrets and must never be copied into this repository.
      PAYEASE_BROKER_MTLS_SERVER_CERT_PATH: /run/payease/broker-mtls/server.crt
      PAYEASE_BROKER_MTLS_SERVER_KEY_PATH: /run/payease/broker-mtls/server.key
      PAYEASE_BROKER_MTLS_CA_CERT_PATH: /run/payease/broker-mtls/ca.crt
      PAYEASE_BROKER_INTERNAL_MTLS_HOST: ${PAYEASE_BROKER_INTERNAL_MTLS_HOST:?Set the internal mTLS bind host}
      PAYEASE_BROKER_INTERNAL_MTLS_PORT: ${PAYEASE_BROKER_INTERNAL_MTLS_PORT:?Set the internal mTLS bind port}
      PAYEASE_LENDER_WALLET_SHARED_SECRET: ${PAYEASE_LENDER_WALLET_SHARED_SECRET:?Set the broker-lender wallet shared secret}
      PAYEASE_SMILE_WALLET_BASE_URL: ${PAYEASE_SMILE_WALLET_BASE_URL:?Set the lender-controlled wallet HTTPS URL}
      PAYEASE_SMILE_WALLET_ALLOWED_HOSTS: ${PAYEASE_SMILE_WALLET_ALLOWED_HOSTS:?Set the lender-controlled wallet hostname allowlist}
      PAYEASE_WALLET_JUMP_TTL_SECONDS: ${PAYEASE_WALLET_JUMP_TTL_SECONDS:-900}
    volumes:
      - ${PAYEASE_BROKER_MTLS_SERVER_CERT_HOST_PATH:?Set the VPS-local mTLS server certificate path}:/run/payease/broker-mtls/server.crt:ro
      - ${PAYEASE_BROKER_MTLS_SERVER_KEY_HOST_PATH:?Set the VPS-local mTLS server private key path}:/run/payease/broker-mtls/server.key:ro
      - ${PAYEASE_BROKER_MTLS_CA_CERT_HOST_PATH:?Set the VPS-local mTLS CA certificate path}:/run/payease/broker-mtls/ca.crt:ro
    ports:
      - "127.0.0.1:3100:3100"
    # Node 22 provides fetch natively, so the runtime image needs neither curl
    # nor wget just to establish readiness.  Use readiness rather than
    # liveness: the service is not healthy until PostgreSQL is reachable.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  payease-preview-postgres18:
