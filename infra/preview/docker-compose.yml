# VPS controlled-preview only. Keep the database on the internal Docker network;
# Caddy is the only public entry point and must enforce preview authentication.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payease_preview
      POSTGRES_USER: payease_preview
      POSTGRES_PASSWORD: ${PAYEASE_PREVIEW_POSTGRES_PASSWORD:?Set a VPS-local preview password}
    volumes:
      - payease-preview-postgres:/var/lib/postgresql/data
      - ../../broker-platform/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payease_preview -d payease_preview"]
      interval: 5s
      timeout: 3s
      retries: 20

  broker-api:
    build:
      context: ../..
      dockerfile: broker-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://payease_preview:${PAYEASE_PREVIEW_POSTGRES_PASSWORD:?Set a VPS-local preview password}@postgres:5432/payease_preview
      HOST: "0.0.0.0"
      PORT: "3100"
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  payease-preview-postgres:
